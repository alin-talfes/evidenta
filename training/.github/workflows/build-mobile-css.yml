name: Build mobile CSS bundle

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - 'mobile-study.css'
      - 'mobile-polish.css'
      - 'runtime-performance.css'
      - 'scripts/build-mobile-css.mjs'
      - '.github/workflows/build-mobile-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build CSS bundle
        run: node scripts/build-mobile-css.mjs
      - name: Commit bundle and index if changed
        run: |
          if [ -z "$(git status --porcelain -- generated/mobile-bundle.css index.html)" ]; then
            echo 'CSS bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/mobile-bundle.css index.html
          git commit -m 'Build mobile CSS bundle'
          git push

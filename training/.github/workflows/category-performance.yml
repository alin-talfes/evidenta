name: Category performance diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/category-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Measure real mobile category transitions
        run: |
          cat > category-perf.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const direct=new Set(['quiz','synthesis','calculations']);
          const categories=['quiz','synthesis','calculations','mistakes','exam','bibliography','learn','legislation','official','interview'];
          const results=[];
          for(const id of categories){
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});
            await page.addInitScript(()=>{
              window.__longTasks=[];
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__longTasks.push({start:e.startTime,duration:e.duration})}).observe({entryTypes:['longtask']})}catch{}
            });
            await page.goto('https://alin-talfes.github.io/evidenta/training/?perf=mobile',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#mobile-nav',{timeout:10000});
            await page.waitForTimeout(100);
            const t0=Date.now();
            if(direct.has(id)){
              await page.click(`[data-mobile-view="${id}"]`);
            }else{
              await page.click('#mobile-more-btn');
              await page.waitForSelector('#mobile-more-sheet.open',{timeout:3000});
              await page.click(`[data-mobile-more-view="${id}"]`);
            }
            await page.waitForSelector(`#${id}.active-view`,{timeout:5000});
            const visibleMs=Date.now()-t0;
            let settled=true;
            try{
              await page.waitForFunction(viewId=>{
                const el=document.getElementById(viewId);
                return el && document.documentElement.dataset.appReady==='true' && !el.dataset.loading && !el.dataset.loadError;
              },id,{timeout:15000});
            }catch{settled=false}
            const settledMs=Date.now()-t0;
            const state=await page.evaluate(viewId=>({
              ready:document.documentElement.dataset.appReady||null,
              loading:document.getElementById(viewId)?.dataset.loading||null,
              loadError:document.getElementById(viewId)?.dataset.loadError||null,
              longTasks:(window.__longTasks||[]).filter(x=>x.start>performance.now()-20000).map(x=>Math.round(x.duration)),
              resources:performance.getEntriesByType('resource').map(r=>({name:r.name.split('/').pop().split('?')[0],duration:Math.round(r.duration),transferSize:r.transferSize})).filter(r=>r.duration>20)
            }),id);
            results.push({id,visibleMs,settledMs,settled,errors,state});
            await context.close();
          }
          console.log('CATEGORY_PERF_JSON');
          console.log(JSON.stringify(results,null,2));
          await browser.close();
          NODE
          node category-perf.mjs

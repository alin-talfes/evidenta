name: Split training data

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'scripts/split-data.mjs'
      - '.github/workflows/split-training-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: split-training-data
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate split payloads
        run: node scripts/split-data.mjs

      - name: Commit generated payloads
        run: |
          if [ -z "$(git status --porcelain -- generated/)" ]; then
            echo 'Generated payloads already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/
          git commit -m 'Generate split training data payloads'
          git push

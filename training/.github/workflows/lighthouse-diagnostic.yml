name: Lighthouse diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lighthouse
        run: npm install -g lighthouse
      - name: Audit mobile performance
        run: |
          lighthouse https://alin-talfes.github.io/evidenta/training/ \
            --only-categories=performance \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags='--headless --no-sandbox' \
            --output=json \
            --output-path=lighthouse.json
      - name: Print key diagnostics
        run: |
          node - <<'NODE'
          const r=require('./lighthouse.json');
          const a=r.audits;
          const pick=id=>({id,title:a[id]?.title,score:a[id]?.score,value:a[id]?.displayValue,numericValue:a[id]?.numericValue});
          const ids=['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','interaction-to-next-paint','mainthread-work-breakdown','bootup-time','network-requests','network-rtt','server-response-time','dom-size','unused-javascript','unused-css-rules','render-blocking-resources','legacy-javascript','long-tasks'];
          console.log(JSON.stringify({performance:r.categories.performance.score, audits:ids.map(pick)},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse.json

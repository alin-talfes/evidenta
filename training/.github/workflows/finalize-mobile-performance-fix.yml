name: Finalize mobile performance fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mobile-performance-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild validated runtime bundle
        run: |
          node scripts/build-runtime-bundle.mjs
          node --check generated/runtime-bundle.js
      - name: Bump service worker cache
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='sw.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/evidenta-training-v\d+/,'evidenta-training-v85');
          fs.writeFileSync(p,s);
          NODE
      - name: Commit runtime and cache fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/runtime-bundle.js sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ship mobile navigation performance fix'
          git push

name: Build runtime bundle

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'adaptive-index.js'
      - 'list-windowing.js'
      - 'perf-telemetry.js'
      - 'runtime-performance.js'
      - 'mobile-nav.js'
      - 'fast-loader.js'
      - 'written-exam-simulation.js'
      - 'scripts/build-runtime-bundle.mjs'
      - 'scripts/patch-written-exam.mjs'
      - 'scripts/patch-shell.mjs'
      - '.github/workflows/build-runtime-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: npm install --no-save acorn esbuild
      - name: Apply staged full-exam patches
        run: node scripts/patch-written-exam.mjs
      - name: Clean app shell
        run: node scripts/patch-shell.mjs
      - name: Build split runtime
        run: node scripts/build-runtime-bundle.mjs
      - name: Validate JavaScript
        run: |
          node --check persistence-layer.js
          node --check adaptive-index.js
          node --check list-windowing.js
          node --check perf-telemetry.js
          node --check written-exam-simulation.js
          node --check generated/app-core.js
          node --check generated/controllers/interview.js
          node --check generated/controllers/legislation.js
          node --check generated/controllers/official.js
          node --check generated/runtime-bundle.js
      - name: Validate shell
        run: |
          ! grep -q 'legal-hotfix.js' index.html
          grep -q 'bootstrap.js' index.html
      - name: Commit performance build if changed
        run: |
          if [ -z "$(git status --porcelain -- index.html written-exam-simulation.js generated/)" ]; then
            echo 'Performance build already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html written-exam-simulation.js generated/app-core.js generated/controllers generated/function-inventory.json generated/runtime-bundle.js
          git commit -m 'Build staged split runtime'
          git push

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CALCULATOR PEDEPSE</title>
    <style>
        :root {
            --bg: #0F1115;
            --card-bg: #12141A;
            --primary: #C9A227;
            --gold: #C9A227;
            --gold-light: #D4AF37;
            --text: #e6e6e6;
            --text-light: #A0A5B0;
            --border: #2a2a35;
            --danger: #ff6b6b;
            --radius: 16px;
            --input-radius: 14px;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overflow-x: hidden; width: 100%; }
        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            padding: 12px;
            font-size: 16px;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            line-height: 1.5;
        }
        .container { max-width: 960px; margin: 0 auto; width: 100%; }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            background: rgba(18, 20, 26, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            position: sticky;
            top: 8px;
            z-index: 10;
        }
        .btn-utility {
            background: rgba(201, 162, 39, 0.08);
            border: 1px solid var(--border);
            color: var(--gold-light);
            border-radius: var(--input-radius);
            padding: 9px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn-utility:hover { background: rgba(201, 162, 39, 0.18); border-color: var(--gold); transform: translateY(-1px); }
        .header {
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 60%, #0d0d1a 100%);
            border: 1px solid var(--border);
            color: var(--gold-light);
            padding: 24px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            border-left: 3px solid rgba(201, 162, 39, 0.7);
            transition: border-color 0.2s;
        }
        .card h3 {
            font-size: 0.95rem;
            color: var(--gold-light);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid;
            border-image: linear-gradient(to right, var(--gold), rgba(201, 162, 39, 0.1)) 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            color: var(--text-light);
        }
        select, input[type="number"], input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: var(--input-radius);
            font-size: 0.9rem;
            background: #0a0a12;
            color: var(--text);
            font-family: var(--font-mono);
            min-height: 44px;
            transition: border-color 0.2s, box-shadow 0.2s;
            letter-spacing: 0.3px;
        }
        select:focus, input:focus, textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.15);
            outline: none;
        }
        .period-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(201, 162, 39, 0.03);
            padding: 12px;
            border-radius: var(--input-radius);
            margin-bottom: 10px;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }
        .period-row > div { flex: 1 1 95px; min-width: 85px; }
        .btn {
            padding: 10px 18px;
            border-radius: var(--input-radius);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            border: none;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            letter-spacing: 0.4px;
        }
        .btn-outline { background: transparent; color: var(--gold-light); border: 1.5px solid var(--gold); }
        .btn-outline:hover { background: rgba(201, 162, 39, 0.1); transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: #0F1115; font-weight: 700; }
        .btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3); }
        .btn-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
        .btn-danger:hover { background: rgba(255, 107, 107, 0.1); }
        .btn-sm { padding: 6px 12px; font-size: 0.72rem; min-height: 32px; }
        .result-section { margin-top: 20px; }
        .result-section h4 { color: var(--gold); font-size: 0.85rem; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .result-item { background: rgba(201, 162, 39, 0.04); border-radius: 8px; padding: 14px 16px; border-left: 3px solid var(--primary); }
        .result-item.important { border-left-color: var(--gold); background: rgba(201, 162, 39, 0.08); }
        .result-label { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-light); font-weight: 600; margin-bottom: 5px; }
        .result-value { font-size: 1.05rem; font-weight: 700; color: var(--gold-light); word-break: break-word; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 14px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.3px; }
        .tag-minor { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .tag-tanar { background: rgba(201, 162, 39, 0.2); color: var(--gold-light); }
        .tag-major { background: rgba(201, 162, 39, 0.2); color: var(--gold-light); }
        .tag-batran { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .hidden { display: none !important; }
        small { color: var(--text-light); font-size: 0.72rem; }
        .fraction { font-family: var(--font-mono); font-size: 1.1em; }
        .error-message { background: rgba(255, 107, 107, 0.08); color: var(--danger); padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 0.82rem; display: none; border: 1px solid rgba(255, 107, 107, 0.2); }
        .error-message.visible { display: block; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
        .footer { text-align: center; padding: 16px 0; font-size: 0.7rem; color: var(--text-light); border-top: 1px solid var(--border); margin-top: 24px; letter-spacing: 0.5px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.82rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--gold); flex-shrink: 0; border-radius: 4px; }
        .steps-container { background: rgba(201, 162, 39, 0.03); border-radius: var(--radius); padding: 16px; margin-top: 16px; font-size: 0.85rem; line-height: 1.7; border: 1px solid var(--border); }
        .steps-container h4 { color: var(--gold); margin-bottom: 8px; }
        .steps-container ol { padding-left: 24px; color: var(--text-light); }
        .steps-container ol li { margin-bottom: 6px; }

        /* Toggle checkbox */
        .toggle-switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .toggle-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
        .toggle-slider { width: 42px; height: 24px; background: var(--border); border-radius: 12px; transition: all 0.2s; }
        .toggle-slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: var(--text-light); border-radius: 50%; transition: all 0.2s; }
        .toggle-switch input:checked + .toggle-slider { background: var(--gold); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); background: #0F1115; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 450px; width: 90%; }
        .modal h4 { color: var(--gold); margin-bottom: 12px; }
        .modal ul { list-style: none; max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
        .modal li { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px; background: rgba(201, 162, 39, 0.04); border: 1px solid transparent; transition: border-color 0.2s; }
        .modal li:hover { border-color: var(--gold); }
        .modal li span { flex: 1; color: var(--text); cursor: pointer; font-size: 0.9rem; }
        .modal li button { background: transparent; border: 1px solid var(--danger); color: var(--danger); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.7rem; transition: all 0.2s; }
        .modal li button:hover { background: rgba(255, 107, 107, 0.1); }
        .modal .close-btn { margin-top: 8px; }
        @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .result-grid { grid-template-columns: 1fr; } .header h1 { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-utility" onclick="saveCase()">💾 SALVEAZĂ SPEȚĂ</button>
        <button class="btn-utility" onclick="openLoadModal()">📂 ÎNCARCĂ SPEȚĂ</button>
        <button class="btn-utility" onclick="resetAll()">↺ RESET</button>
    </div>
    <div class="header">
        <h1><span class="icon">⚖️</span> CALCULATOR PEDEPSE</h1>
    </div>

    <div class="card"><h3>📌 1. DATE PPL</h3>
        <div class="form-grid">
            <div><label>Sex</label><select id="sex"><option value="">—</option><option value="M">Masculin</option><option value="F">Feminin</option></select></div>
            <div><label>Data nașterii</label><input type="text" id="birthDate" placeholder="zz.ll.aaaa"></div>
            <div id="ageTag" style="display:flex;align-items:flex-end;gap:6px;"></div>
        </div>
        <div style="margin-top:12px;"><label>📝 Observații / Nume PPL (opțional)</label><textarea id="observations" rows="2" placeholder="ex: Popescu Ion"></textarea></div>
    </div>

    <div class="card"><h3>⚖️ 2. PEDEAPSA</h3>
        <div class="form-grid">
            <div><label>Articol liberare condiționată</label><select id="liberationArticle"><option value="">—</option><option value="NCP100">NCP art. 100</option><option value="NCP99">NCP art. 99 (viață)</option><option value="NCP124">NCP art. 124</option><option value="NCP125">NCP art. 125</option><option value="VCP59">VCP art. 59</option><option value="VCP591">VCP art. 59¹</option><option value="VCP602">VCP art. 60 alin. 2</option><option value="VCP603">VCP art. 60 alin. 3</option></select></div>
            <div>
                <label>Detențiune pe viață</label>
                <label class="toggle-switch" style="margin-top:8px;">
                    <input type="checkbox" id="lifeSentence">
                    <span class="toggle-slider"></span>
                    <span style="font-size:0.8rem;color:var(--text-light);">Bifați dacă este cazul</span>
                </label>
            </div>
        </div>
        <div id="sentenceDuration" class="form-grid" style="margin-top:8px;">
            <div><label>Ani</label><input type="number" id="durYears" value="0" min="0"></div>
            <div><label>Luni</label><input type="number" id="durMonths" value="0" min="0"></div>
            <div><label>Zile</label><input type="number" id="durDays" value="0" min="0"></div>
        </div>
        <div style="margin-top:12px;"><label>Data începerii executării pedepsei</label><input type="text" id="startDate" placeholder="zz.ll.aaaa"></div>
    </div>

    <div class="card"><h3>📅 3. PERIOADE DEDUSE</h3><div id="deductionsContainer"></div><button class="btn btn-outline btn-sm" onclick="addDedRow()">+ Adaugă</button></div>
    <div class="card"><h3>🔢 4. RECURS COMPENSATORIU (Legea 169/2017)</h3><div id="manualDeductionsContainer"></div><button class="btn btn-outline btn-sm" onclick="addManDedRow()">+ Adaugă</button></div>
    <div class="card"><h3>🚫 5. PERIOADE ADĂUGATE</h3><div id="nonExecContainer"></div><button class="btn btn-outline btn-sm" onclick="addNonExecRow()">+ Adaugă</button></div>

    <div class="card" id="restCard">
        <h3>📉 6. CALCUL REST RĂMAS DE EXECUTAT (OPȚIONAL)</h3>
        <div class="form-grid">
            <div>
                <label>Data liberării condiționate</label>
                <input type="text" id="conditionalReleaseDate" placeholder="zz.ll.aaaa">
            </div>
        </div>
    </div>

    <div id="errorContainer" class="error-message"></div>
    <div class="btn-row">
        <button class="btn btn-gold" onclick="calculateAll()">📐 CALCULEAZĂ</button>
        <button class="btn btn-outline" onclick="exportCSV()">📊 EXPORTĂ CSV</button>
    </div>

    <div class="card hidden" id="resultsCard">
        <h3>📊 REZULTATE</h3>
        <div id="resultsContent"></div>
        <div id="stepsContainer" class="steps-container hidden">
            <h4>🧮 PAȘII CALCULULUI</h4>
            <ol id="stepsList"></ol>
        </div>
    </div>
    <div class="footer">CALCULATOR PEDEPSE | BETA 0.2</div>
</div>

<script>
    // ========== UTILS ==========
    const parseDate = (str) => {
        if (!str) return null;
        str = str.trim();
        const parts = str.split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0]), month = parseInt(parts[1]), year = parseInt(parts[2]);
            if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                const d = new Date(year, month - 1, day);
                if (d.getDate() === day && d.getMonth() === month - 1 && d.getFullYear() === year) return d;
            }
        }
        return null;
    };
    const fmtDate = (d) => d && !isNaN(d) ? `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}` : '—';
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const daysBetween = (a,b) => Math.round((b.getTime()-a.getTime())/86400000);

    const addCalendarSafe = (date, years, months, days) => {
        const d = new Date(date);
        const targetDay = d.getDate();
        d.setDate(1);
        d.setFullYear(d.getFullYear() + years);
        d.setMonth(d.getMonth() + months);
        const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(targetDay, lastDay));
        d.setDate(d.getDate() + days);
        return d;
    };

    const ageExact = (birth, now) => {
        let y = now.getFullYear() - birth.getFullYear(), m = now.getMonth() - birth.getMonth(), d = now.getDate() - birth.getDate();
        if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
        if (m < 0) { y--; m += 12; }
        return { y, m, d };
    };

    const getAgeCategoryAtDate = (birthDate, targetDate, sex) => {
        const ageY = ageExact(birthDate, targetDate).y;
        if (ageY < 18) return "MINOR";
        if (ageY < 21) return "TANAR";
        const isNCP = document.getElementById('liberationArticle').value.startsWith("NCP");
        const elderly = isNCP ? (ageY >= 60) : ((sex==='M' && ageY >= 60) || (sex==='F' && ageY >= 55));
        return elderly ? "BATRAN" : "MAJOR";
    };

    const liberationRules = [
        { article:"NCP100", age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,2], total:[2,3] },
        { article:"NCP100", age:["MAJOR","TANAR"], minYears:10, mandatory:[2,3,7305], total:[3,4,7305] },
        { article:"NCP100", age:["BATRAN"], maxYears:10, mandatory:[1,3], total:[1,2] },
        { article:"NCP100", age:["BATRAN"], minYears:10, mandatory:[1,2,7305], total:[2,3,7305] },
        { article:"NCP99",  age:["MINOR","TANAR","MAJOR","BATRAN"], life:true, mandatory:[1,2,7305], total:[1,2,7305] },
        { article:"NCP124", age:["MINOR","TANAR","MAJOR","BATRAN"], mandatory:[1,2], total:[1,2] },
        { article:"NCP125", age:["MINOR","TANAR","MAJOR","BATRAN"], mandatory:[1,2], total:[1,2] },
        { article:"VCP59",  age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,2], total:[2,3] },
        { article:"VCP59",  age:["MAJOR","TANAR"], minYears:10, mandatory:[2,3], total:[3,4] },
        { article:"VCP591", age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,3], total:[1,2] },
        { article:"VCP591", age:["MAJOR","TANAR"], minYears:10, mandatory:[1,2], total:[2,3] },
        { article:"VCP602", age:["BATRAN"], maxYears:10, mandatory:[1,100], total:[1,3] },
        { article:"VCP602", age:["BATRAN"], minYears:10, mandatory:[1,100], total:[1,2] },
        { article:"VCP603", age:["BATRAN"], maxYears:10, mandatory:[1,100], total:[1,4] },
        { article:"VCP603", age:["BATRAN"], minYears:10, mandatory:[1,100], total:[1,3] }
    ];

    // ========== STORAGE ==========
    function saveCase() {
        const name = prompt('Nume speță:');
        if (!name || !name.trim()) return;
        const data = {
            sex: document.getElementById('sex').value,
            birthDate: document.getElementById('birthDate').value,
            observations: document.getElementById('observations').value,
            life: document.getElementById('lifeSentence').checked,
            art: document.getElementById('liberationArticle').value,
            y: document.getElementById('durYears').value,
            m: document.getElementById('durMonths').value,
            d: document.getElementById('durDays').value,
            start: document.getElementById('startDate').value,
            condRelease: document.getElementById('conditionalReleaseDate').value,
            dedRows: Array.from(document.querySelectorAll('.deduction-row')).map(r => ({start: r.querySelector('.ded-start').value, end: r.querySelector('.ded-end').value})),
            manDed: Array.from(document.querySelectorAll('.manual-days')).map(i => i.value),
            nonRows: Array.from(document.querySelectorAll('.non-exec-row')).map(r => ({type: r.querySelector('.ne-type').value, start: r.querySelector('.ne-start').value, end: r.querySelector('.ne-end').value}))
        };
        const cases = JSON.parse(localStorage.getItem('anpCases') || '{}');
        cases[name.trim()] = data;
        localStorage.setItem('anpCases', JSON.stringify(cases));
        alert('Speță salvată!');
    }

    function openLoadModal() {
        const cases = JSON.parse(localStorage.getItem('anpCases') || '{}');
        const names = Object.keys(cases);
        if (names.length === 0) { alert('Nicio speță salvată.'); return; }
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        let html = '<div class="modal"><h4>Selectează sau șterge o speță</h4><ul>';
        names.forEach(name => {
            html += `<li><span onclick="loadCaseByName('${name.replace(/'/g, "\\'")}')">${name}</span><button onclick="deleteCase('${name.replace(/'/g, "\\'")}')">🗑️</button></li>`;
        });
        html += '</ul><button class="btn btn-outline close-btn" onclick="this.closest(\'.modal-overlay\').remove()">Închide</button></div>';
        overlay.innerHTML = html;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    }

    window.loadCaseByName = function(name) {
        const cases = JSON.parse(localStorage.getItem('anpCases') || '{}');
        if (!cases[name]) return;
        const d = cases[name];
        document.getElementById('sex').value = d.sex; sex = d.sex;
        document.getElementById('birthDate').value = d.birthDate;
        document.getElementById('observations').value = d.observations;
        document.getElementById('lifeSentence').checked = d.life;
        document.getElementById('sentenceDuration').classList.toggle('hidden', d.life);
        document.getElementById('liberationArticle').value = d.art;
        document.getElementById('durYears').value = d.y;
        document.getElementById('durMonths').value = d.m;
        document.getElementById('durDays').value = d.d;
        document.getElementById('startDate').value = d.start;
        document.getElementById('conditionalReleaseDate').value = d.condRelease || '';
        document.getElementById('deductionsContainer').innerHTML = '';
        (d.dedRows||[]).forEach(r => { addDedRow(); const last = document.querySelector('.deduction-row:last-child'); last.querySelector('.ded-start').value = r.start; last.querySelector('.ded-end').value = r.end; updDed(last); });
        document.getElementById('manualDeductionsContainer').innerHTML = '';
        (d.manDed||[]).forEach(v => { addManDedRow(); document.querySelector('.manual-days:last-child').value = v; });
        document.getElementById('nonExecContainer').innerHTML = '';
        (d.nonRows||[]).forEach(r => { addNonExecRow(); const last = document.querySelector('.non-exec-row:last-child'); last.querySelector('.ne-type').value = r.type; last.querySelector('.ne-start').value = r.start; last.querySelector('.ne-end').value = r.end; updNonExec(last); });
        updAgeTag(); updSpecCond();
        document.querySelector('.modal-overlay')?.remove();
        alert('Speță încărcată!');
    };

    window.deleteCase = function(name) {
        if (!confirm(`Sigur doriți să ștergeți speța "${name}"?`)) return;
        const cases = JSON.parse(localStorage.getItem('anpCases') || '{}');
        delete cases[name];
        localStorage.setItem('anpCases', JSON.stringify(cases));
        document.querySelector('.modal-overlay')?.remove();
        alert('Speță ștearsă!');
        setTimeout(openLoadModal, 100);
    };

    function autoSave() {

    function sumIntervals(intervals) {
        if (!intervals.length) return 0;
        const sorted = intervals.slice().sort((a,b) => a[0].getTime()-b[0].getTime());
        let total = daysBetween(sorted[0][0], sorted[0][1]) + 1;
        let currentEnd = sorted[0][1];
        for (let i=1; i<sorted.length; i++) {
            const [start, end] = sorted[i];
            if (start <= currentEnd) {
                if (end > currentEnd) { total += daysBetween(currentEnd, end); currentEnd = end; }
            } else { total += daysBetween(start, end) + 1; currentEnd = end; }
        }
        return total;
    }

    function validateInputs(birthDate, startDate, life, art, y, m, d) {
        const err = [];
        sex = document.getElementById('sex').value;
        if (!sex) err.push('Selectați sexul.');
        if (!birthDate) err.push('Data nașterii invalidă.');
        if (!startDate) err.push('Data începerii invalidă.');
        if (!life && !art) err.push('Selectați articolul de liberare condiționată.');
        if (!life && y===0 && m===0 && d===0) err.push('Introduceți durata pedepsei.');
        if (birthDate && startDate && birthDate > startDate) err.push('Data nașterii este ulterioară începerii executării.');
        document.querySelectorAll('.deduction-row').forEach((r,i) => {
            const st = r.querySelector('.ded-start').value.trim(), en = r.querySelector('.ded-end').value.trim();
            if (!st||!en) err.push(`Deducerea ${i+1}: date incomplete.`);
            else {
                const sD = parseDate(st), eD = parseDate(en);
                if (!sD||!eD) err.push(`Deducerea ${i+1}: format invalid.`);
                else if (eD < sD) err.push(`Deducerea ${i+1}: sfârșit înainte de început.`);
            }
        });
        document.querySelectorAll('.non-exec-row').forEach((r,i) => {
            const st = r.querySelector('.ne-start').value.trim(), en = r.querySelector('.ne-end').value.trim();
            if (!st||!en) err.push(`Perioada neexecutată ${i+1}: date incomplete.`);
            else {
                const sD = parseDate(st), eD = parseDate(en);
                if (!sD||!eD) err.push(`Perioada neexecutată ${i+1}: format invalid.`);
                else if (eD <= sD) err.push(`Perioada neexecutată ${i+1}: date invalide.`);
            }
        });
        const condReleaseStr = document.getElementById('conditionalReleaseDate').value.trim();
        if (condReleaseStr) {
            const condDate = parseDate(condReleaseStr);
            if (!condDate) err.push('Data liberării condiționate este invalidă.');
            else if (condDate < startDate) err.push('Data liberării condiționate este înainte de începerea pedepsei.');
            else if (condDate > today()) err.push('Data liberării condiționate este în viitor.');
        }
        return err;
    }

    function calculateAll() {
        const errC = document.getElementById('errorContainer'); errC.classList.remove('visible');
        const birthDate = parseDate(document.getElementById('birthDate').value.trim());
        const startDate = parseDate(document.getElementById('startDate').value.trim());
        const life = document.getElementById('lifeSentence').checked;
        const art = document.getElementById('liberationArticle').value;
        const y = parseInt(document.getElementById('durYears').value)||0, m = parseInt(document.getElementById('durMonths').value)||0, d = parseInt(document.getElementById('durDays').value)||0;
        sex = document.getElementById('sex').value;
        const err = validateInputs(birthDate, startDate, life, art, y, m, d);
        if (err.length>0) { errC.innerHTML = err.map(e=>'• '+e).join('<br>'); errC.classList.add('visible'); return; }

        const steps = [];

        let totalDays, theorExp;
        if (life) {
            const d20 = new Date(startDate); d20.setFullYear(d20.getFullYear()+20); d20.setDate(d20.getDate()-1);
            totalDays = daysBetween(startDate, d20) + 1; theorExp = d20;
            steps.push(`Pedepsa este detențiune pe viață. Se folosește plafonul de 20 ani (7305 zile).`);
        } else {
            theorExp = addCalendarSafe(startDate, y, m, d); theorExp.setDate(theorExp.getDate()-1);
            totalDays = daysBetween(startDate, theorExp) + 1;
            steps.push(`Data începerii executării: ${fmtDate(startDate)}. Durata pedepsei: ${y} ani, ${m} luni, ${d} zile.`);
            steps.push(`Adunăm calendaristic la data începerii: anii, apoi lunile, apoi zilele. Scădem o zi (regula OMJ 2188/C/2022).`);
            steps.push(`Expirarea teoretică este ${fmtDate(theorExp)}.`);
            steps.push(`Numărăm zilele dintre ${fmtDate(startDate)} și ${fmtDate(theorExp)}, inclusiv ambele capete: ${totalDays} zile. Acesta este mandatul total.`);
        }

        const dedIntervals = []; document.querySelectorAll('.deduction-row').forEach(r => { const sD=parseDate(r.querySelector('.ded-start').value.trim()), eD=parseDate(r.querySelector('.ded-end').value.trim()); if(sD&&eD) dedIntervals.push([sD,eD]); });
        let ded = sumIntervals(dedIntervals);
        document.querySelectorAll('.manual-days').forEach(i=>{ const v=parseInt(i.value); if(!isNaN(v)&&v>0) ded+=v; });
        if (ded > totalDays) { errC.innerHTML = '• Deducerile depășesc mandatul total.'; errC.classList.add('visible'); return; }
        steps.push(`Perioadele deduse însumează ${ded} zile (după unificarea suprapunerilor).`);

        let non = 0;
        document.querySelectorAll('.ne-days').forEach(inp => {
            const v = parseInt(inp.value);
            if (!isNaN(v) && v > 0) non += v;
        });
        steps.push(`Perioadele adăugate (neexecutate) însumează ${non} zile.`);

        let realExp = new Date(theorExp); realExp.setDate(realExp.getDate() - ded + non);
        steps.push(`Expirarea reală = ${fmtDate(theorExp)} − ${ded} zile deduse + ${non} zile adăugate = ${fmtDate(realExp)}.`);

        const ageAtExpiry = getAgeCategoryAtDate(birthDate, theorExp, sex);
        steps.push(`La data începerii executării, deținutul avea categoria de vârstă: ${ageAtExpiry}.`);

        let mR=1/2, tR=2/3, pM=Infinity, pT=Infinity, articleInfo='';
        if (life) { mR=1/2; tR=1/2; pM=totalDays; pT=totalDays; articleInfo='NCP art. 99 (viață)'; }
        else {
            const totalMonths = y*12 + m + d/30; const sentenceOver10 = totalMonths > 120;
            if (art === 'NCP100') {
                const expiresBefore60 = theorExp < new Date(birthDate.getFullYear()+60, birthDate.getMonth(), birthDate.getDate());
                if (expiresBefore60) { if(sentenceOver10){mR=2/3;tR=3/4;pM=7305;pT=7305;} else{mR=1/2;tR=2/3;} articleInfo = `NCP art. 100 (${ageAtExpiry}, expiră < 60 ani) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
                else { if(sentenceOver10){mR=1/2;tR=2/3;pM=7305;pT=7305;} else{mR=1/3;tR=1/2;} articleInfo = `NCP art. 100 (${ageAtExpiry}, expiră ≥ 60 ani) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
            } else {
                const rule = liberationRules.find(r => r.article === art && r.age.includes(ageAtExpiry) && ((r.life&&life) || (!r.life && ((r.maxYears&&!sentenceOver10)||(r.minYears&&sentenceOver10)||(!r.maxYears&&!r.minYears)))));
                if (rule) { mR=rule.mandatory[0]/rule.mandatory[1]; tR=rule.total[0]/rule.total[1]; pM=rule.mandatory[2]||Infinity; pT=rule.total[2]||Infinity; articleInfo=`${art} (${ageAtExpiry}) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
                else { errC.innerHTML='• Nu există regulă de liberare.'; errC.classList.add('visible'); return; }
            }
        }
        steps.push(`Articolul aplicabil: ${articleInfo}.`);
        steps.push(`Fracția minimă obligatorie: ${fracStr(mR)}. Fracția totală/propozabilă: ${fracStr(tR)}.`);

        let mDays=Math.floor(totalDays*mR), tDays=Math.floor(totalDays*tR);
        if(mDays>pM)mDays=pM; if(tDays>pT)tDays=pT;
        steps.push(`Fracția minimă: Math.floor(${totalDays} × ${fracStr(mR)}) = ${mDays} zile (din mandatul total).`);
        steps.push(`Fracția totală: Math.floor(${totalDays} × ${fracStr(tR)}) = ${tDays} zile (din mandatul total).`);

        let mDate=new Date(startDate); mDate.setDate(mDate.getDate()+mDays-1); mDate.setDate(mDate.getDate()-ded+non);
        let tDate=new Date(startDate); tDate.setDate(tDate.getDate()+tDays-1); tDate.setDate(tDate.getDate()-ded+non);
        const fifth=Math.floor(totalDays/5);
        let fDate=new Date(startDate); fDate.setDate(fDate.getDate()+fifth-1); fDate.setDate(fDate.getDate()-ded+non);
        steps.push(`Data fracției minime: ${fmtDate(startDate)} + ${mDays} zile − 1 − ${ded} zile deduse + ${non} zile adăugate = ${fmtDate(mDate)}.`);
        steps.push(`Data fracției totale: ${fmtDate(startDate)} + ${tDays} zile − 1 − ${ded} zile deduse + ${non} zile adăugate = ${fmtDate(tDate)}.`);

        steps.push(`Termenul de reanalizare 1/5: Math.floor(${totalDays} / 5) = ${fifth} zile.`);
        steps.push(`Data 1/5: ${fmtDate(startDate)} + ${fifth} zile − 1 − ${ded} zile deduse + ${non} zile adăugate = ${fmtDate(fDate)}.`);

        const executedDays = Math.max(0, daysBetween(startDate, today()) + 1);
        const remaining = realExp ? Math.max(0, daysBetween(today(), realExp) + 1) : '—';
        steps.push(`Zile executate efectiv până astăzi (${fmtDate(today())}): ${executedDays} zile.`);
        steps.push(`Rest rămas până la expirarea reală: ${remaining} zile.`);

        const quarantineEnd = new Date(startDate);
        quarantineEnd.setDate(quarantineEnd.getDate() + 20);
        steps.push(`Carantina și observarea: ${fmtDate(startDate)} + 20 zile = ${fmtDate(quarantineEnd)}.`);

        let restHtml = '';
        const condReleaseStr = document.getElementById('conditionalReleaseDate').value.trim();
        if (condReleaseStr && parseDate(condReleaseStr)) {
            const condReleaseDate = parseDate(condReleaseStr);
            if (realExp) {
                const restDays = Math.max(0, daysBetween(condReleaseDate, realExp));
                steps.push(`Rest rămas după liberarea condiționată (${fmtDate(condReleaseDate)}): ${fmtDate(realExp)} − ${fmtDate(condReleaseDate)} = ${restDays} zile.`);
                restHtml = `<div class="result-section"><h4>REST RĂMAS DE EXECUTAT (după liberarea condiționată)</h4><div class="result-grid">`;
                restHtml += `<div class="result-item"><div class="result-label">Data liberării</div><div class="result-value">${fmtDate(condReleaseDate)}</div></div>`;
                restHtml += `<div class="result-item important"><div class="result-label">Rest rămas</div><div class="result-value">${restDays} zile</div></div>`;
                restHtml += `</div></div>`;
            }
        }

        const nume=document.getElementById('observations').value.trim();
        let html='';
        if(nume) html+=`<div class="result-item" style="margin-bottom:8px;"><div class="result-label">Observații / Nume PPL</div><div class="result-value">${nume}</div></div>`;

        html+=`<div class="result-section"><h4>DETALII MANDAT</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">Expirare teoretică</div><div class="result-value">${fmtDate(theorExp)}</div></div>`;
        html+=`<div class="result-item important"><div class="result-label">Expirare REALĂ</div><div class="result-value">${fmtDate(realExp)}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile deduse</div><div class="result-value">${ded} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile adăugate (neexecutate)</div><div class="result-value" style="color:#ff6b6b;">${non} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile executate efectiv</div><div class="result-value">${executedDays} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Rest rămas</div><div class="result-value">${remaining} zile</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>FRACȚII LIBERARE CONDIȚIONATĂ</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">FRACȚIE MINIMĂ OBLIGATORIE</div><div class="result-value"><span class="fraction">${fracStr(mR)}</span> → (fără deduceri: ${mDays}z / cu deduceri: ${daysBetween(startDate, mDate)+1}z)</div><div class="result-label" style="margin-top:4px;">Data</div><div class="result-value">${fmtDate(mDate)}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">DATA PROPOZABILĂ</div><div class="result-value"><span class="fraction">${fracStr(tR)}</span> → (fără deduceri: ${tDays}z / cu deduceri: ${daysBetween(startDate, tDate)+1}z)</div><div class="result-label" style="margin-top:4px;">Data</div><div class="result-value">${fmtDate(tDate)}</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>REANALIZARE 1/5</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">1/5 mandat</div><div class="result-value">(fără deduceri: ${fifth}z / cu deduceri: ${daysBetween(startDate, fDate)+1}z)</div><div class="result-label" style="margin-top:4px;">Data împlinirii</div><div class="result-value">${fmtDate(fDate)}</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>ALTE DATE</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">Articol LC</div><div class="result-value">${articleInfo}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Mandat total</div><div class="result-value">${totalDays} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Carantină expiră</div><div class="result-value">${fmtDate(quarantineEnd)}</div></div>`;
        html+=`</div></div>`;

        html += restHtml;

        document.getElementById('resultsContent').innerHTML = html;
        document.getElementById('stepsList').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
        document.getElementById('stepsContainer').classList.remove('hidden');
        document.getElementById('resultsCard').classList.remove('hidden');

        autoSave();
    }

            const st=r.querySelector('.ne-start').value.trim();
            const en=r.querySelector('.ne-end').value.trim();
            if (st && en) csv += `"Perioadă adăugată ${i+1} (${typ})","${st} - ${en}"\n`;
        });
        csv += '\n';
        const content = document.getElementById('resultsContent');
        if (content) {
            content.querySelectorAll('.result-item').forEach(item => {
                const label = item.querySelector('.result-label')?.innerText || '';
                const value = item.querySelector('.result-value')?.innerText || '';
                csv += `"${label}","${value}"\n`;
            });
        }
        const blob = new Blob([csv], {type:'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'calculator_pedepse.csv';
        a.click();
    }
</script>
</body>
</html>

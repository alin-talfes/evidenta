<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CALCULATOR PEDEPSE – Biroul Evidență Deținuți</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #12121a;
            --primary: #c8a951;
            --gold: #c8a951;
            --gold-light: #e0c97a;
            --text: #e6e6e6;
            --text-light: #b0b0b0;
            --border: #2a2a35;
            --danger: #ff6b6b;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(0,0,0,0.5);
            --font: 'Segoe UI', system-ui, sans-serif;
            --accent-glow: 0 0 0 3px rgba(200,169,81,0.15);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overflow-x: hidden; width: 100%; }
        body { background: var(--bg); font-family: var(--font); color: var(--text); padding: 10px; font-size: 16px; overflow-x: hidden; width: 100%; max-width: 100vw; line-height: 1.5; }
        .container { max-width: 960px; margin: 0 auto; width: 100%; }
        .top-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-utility { background: rgba(200,169,81,0.08); border:1px solid var(--border); color:var(--gold-light); border-radius:20px; padding:7px 14px; font-size:0.78rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
        .btn-utility:hover { background: rgba(200,169,81,0.18); border-color:var(--gold); }
        .header { background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 60%, #0d0d1a 100%); border:1px solid var(--border); color:var(--gold-light); padding:20px 16px; border-radius:var(--radius); margin-bottom:14px; text-align:center; }
        .header h1 { font-size:1.3rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }
        .card { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 15px; margin-bottom:10px; border:1px solid var(--border); border-left:4px solid var(--gold); }
        .card h3 { font-size:0.92rem; color:var(--gold-light); margin-bottom:10px; padding-bottom:7px; border-bottom:2px solid rgba(200,169,81,0.2); display:flex; align-items:center; gap:6px; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:10px; }
        label { display:block; font-weight:600; font-size:0.78rem; margin-bottom:4px; color:var(--text-light); }
        select, input[type="number"], input[type="text"], textarea { width:100%; padding:8px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:0.9rem; background:#0a0a12; color:var(--text); font-family:var(--font); min-height:42px; }
        .period-row { display:flex; gap:8px; align-items:flex-end; background:rgba(200,169,81,0.03); padding:10px; border-radius:8px; margin-bottom:8px; flex-wrap:wrap; border:1px solid var(--border); }
        .period-row > div { flex:1 1 90px; min-width:80px; }
        .btn { padding:10px 18px; border-radius:8px; font-weight:600; font-size:0.82rem; cursor:pointer; border:none; min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
        .btn-outline { background:transparent; color:var(--gold-light); border:1.5px solid var(--gold); }
        .btn-gold { background:var(--gold); color:#0a0a0f; font-weight:700; }
        .btn-danger { background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
        .btn-sm { padding:5px 10px; font-size:0.72rem; min-height:32px; }
        .result-section { margin-top: 16px; }
        .result-section h4 { color: var(--gold); font-size: 0.85rem; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .result-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(145px,1fr)); gap:10px; margin-bottom:10px; }
        .result-item { background:rgba(200,169,81,0.04); border-radius:6px; padding:12px 14px; border-left:4px solid var(--primary); }
        .result-item.important { border-left-color:var(--gold); background:rgba(200,169,81,0.08); }
        .result-label { font-size:0.62rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-light); font-weight:600; margin-bottom:4px; }
        .result-value { font-size:1.05rem; font-weight:700; color:var(--gold-light); word-break:break-word; }
        .remaining { font-size:0.7rem; font-weight:600; margin-top:3px; color:#4caf50; }
        .remaining.overdue { color:#ff6b6b; }
        .tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .tag-minor { background:rgba(255,107,107,0.2); color:#ff6b6b; }
        .tag-tanar { background:rgba(200,169,81,0.2); color:#e0c97a; }
        .tag-major { background:rgba(200,169,81,0.2); color:#e0c97a; }
        .tag-batran { background:rgba(255,193,7,0.2); color:#ffc107; }
        .hidden { display:none !important; }
        small { color:var(--text-light); font-size:0.72rem; }
        .fraction { font-family:'Cambria Math', 'Times New Roman', serif; font-size:1.1em; }
        .error-message { background:rgba(255,107,107,0.08); color:var(--danger); padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:0.82rem; display:none; border:1px solid rgba(255,107,107,0.2); }
        .error-message.visible { display:block; }
        .btn-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:16px 0; }
        .footer { text-align:center; padding:12px 0; font-size:0.7rem; color:var(--text-light); border-top:1px solid var(--border); margin-top:18px; }
        .checkbox-group { display:flex; align-items:center; gap:6px; margin-bottom:6px; font-size:0.8rem; }
        .checkbox-group input[type="checkbox"] { width:16px; height:16px; accent-color:var(--gold); flex-shrink:0; }
        @media (max-width:480px) { .form-grid { grid-template-columns:1fr; } .result-grid { grid-template-columns:1fr; } .header h1 { font-size:1.1rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <button class="btn-utility" onclick="resetAll()">↺ Reset</button>
    </div>
    <div class="header">
        <h1><span class="icon">⚖️</span> CALCULATOR PEDEPSE<br><small style="font-size:0.8rem;font-weight:400;color:#b0b0b0;">Biroul Evidență Deținuți</small></h1>
    </div>

    <div class="card"><h3>📌 1. Date personale</h3>
        <div class="form-grid">
            <div><label>Sex</label><select id="sex"><option value="">—</option><option value="M">Masculin</option><option value="F">Feminin</option></select></div>
            <div><label>Data nașterii</label><input type="text" id="birthDate" placeholder="zz.ll.aaaa"></div>
            <div id="ageTag" style="display:flex;align-items:flex-end;gap:4px;"></div>
        </div>
        <div style="margin-top:10px;"><label>📝 Nume deținut (opțional)</label><textarea id="observations" rows="2" placeholder="ex: Popescu Ion"></textarea></div>
    </div>

    <div class="card"><h3>⚖️ 2. Pedeapsa</h3>
        <div class="form-grid">
            <div><label>Articol liberare condiționată</label><select id="liberationArticle"><option value="">—</option><option value="NCP100">NCP art. 100</option><option value="NCP99">NCP art. 99 (viață)</option><option value="NCP124">NCP art. 124</option><option value="NCP125">NCP art. 125</option><option value="VCP59">VCP art. 59</option><option value="VCP591">VCP art. 59¹</option><option value="VCP602">VCP art. 60 alin. 2</option><option value="VCP603">VCP art. 60 alin. 3</option></select></div>
            <div><label>Detențiune pe viață</label><div class="checkbox-group" style="margin-top:8px;"><input type="checkbox" id="lifeSentence"> <label for="lifeSentence">Bifați dacă este cazul</label></div></div>
        </div>
        <div id="sentenceDuration" class="form-grid" style="margin-top:6px;">
            <div><label>Ani</label><input type="number" id="durYears" value="0" min="0"></div>
            <div><label>Luni</label><input type="number" id="durMonths" value="0" min="0"></div>
            <div><label>Zile</label><input type="number" id="durDays" value="0" min="0"></div>
        </div>
        <div style="margin-top:10px;"><label>Data începerii pedepsei</label><input type="text" id="startDate" placeholder="zz.ll.aaaa"></div>
    </div>

    <div class="card"><h3>📅 3. Deduceri (capete incluse)</h3><div id="deductionsContainer"></div><button class="btn btn-outline btn-sm" onclick="addDedRow()">+ Adaugă</button></div>
    <div class="card"><h3>🔢 4. Deduceri manuale (Legea 169/2017)</h3><div id="manualDeductionsContainer"></div><button class="btn btn-outline btn-sm" onclick="addManDedRow()">+ Adaugă</button></div>
    <div class="card"><h3>🚫 5. Perioade neexecutate</h3><div id="nonExecContainer"></div><button class="btn btn-outline btn-sm" onclick="addNonExecRow()">+ Adaugă</button></div>

    <div id="errorContainer" class="error-message"></div>
    <div class="btn-row">
        <button class="btn btn-gold" onclick="calculateAll()">📐 Calculează</button>
        <button class="btn btn-outline" onclick="exportCSV()">📊 CSV</button>
    </div>

    <div class="card hidden" id="resultsCard">
        <h3>📊 Rezultate</h3>
        <div id="resultsContent"></div>
    </div>
    <div class="footer">CALCULATOR PEDEPSE – Biroul Evidență Deținuți | v2.2</div>
</div>

<script>
    const parseDate = (str) => {
        if (!str) return null;
        str = str.trim();
        const parts = str.split('.');
        if (parts.length === 3) {
            const day = parseInt(parts[0]), month = parseInt(parts[1]), year = parseInt(parts[2]);
            if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                const d = new Date(year, month - 1, day);
                if (d.getDate() === day && d.getMonth() === month - 1 && d.getFullYear() === year) return d;
            }
        }
        return null;
    };
    const fmtDate = (d) => d && !isNaN(d) ? `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}` : '—';
    const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
    const daysBetween = (a,b) => Math.round((b.getTime()-a.getTime())/86400000);

    const addCalendarSafe = (date, years, months, days) => {
        const d = new Date(date);
        const targetDay = d.getDate();
        d.setDate(1);
        d.setFullYear(d.getFullYear() + years);
        d.setMonth(d.getMonth() + months);
        const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(targetDay, lastDay));
        d.setDate(d.getDate() + days);
        return d;
    };

    const ageExact = (birth, now) => {
        let y = now.getFullYear() - birth.getFullYear(), m = now.getMonth() - birth.getMonth(), d = now.getDate() - birth.getDate();
        if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
        if (m < 0) { y--; m += 12; }
        return { y, m, d };
    };

    const getAgeCategoryAtDate = (birthDate, targetDate, sex) => {
        const ageY = ageExact(birthDate, targetDate).y;
        if (ageY < 18) return "MINOR";
        if (ageY < 21) return "TANAR";
        const isNCP = document.getElementById('liberationArticle').value.startsWith("NCP");
        const elderly = isNCP ? (ageY >= 60) : ((sex==='M' && ageY >= 60) || (sex==='F' && ageY >= 55));
        return elderly ? "BATRAN" : "MAJOR";
    };

    const liberationRules = [
        { article:"NCP100", age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,2], total:[2,3] },
        { article:"NCP100", age:["MAJOR","TANAR"], minYears:10, mandatory:[2,3,7305], total:[3,4,7305] },
        { article:"NCP100", age:["BATRAN"], maxYears:10, mandatory:[1,3], total:[1,2] },
        { article:"NCP100", age:["BATRAN"], minYears:10, mandatory:[1,2,7305], total:[2,3,7305] },
        { article:"NCP99",  age:["MINOR","TANAR","MAJOR","BATRAN"], life:true, mandatory:[1,2,7305], total:[1,2,7305] },
        { article:"NCP124", age:["MINOR","TANAR","MAJOR","BATRAN"], mandatory:[1,2], total:[1,2] },
        { article:"NCP125", age:["MINOR","TANAR","MAJOR","BATRAN"], mandatory:[1,2], total:[1,2] },
        { article:"VCP59",  age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,2], total:[2,3] },
        { article:"VCP59",  age:["MAJOR","TANAR"], minYears:10, mandatory:[2,3], total:[3,4] },
        { article:"VCP591", age:["MAJOR","TANAR"], maxYears:10, mandatory:[1,3], total:[1,2] },
        { article:"VCP591", age:["MAJOR","TANAR"], minYears:10, mandatory:[1,2], total:[2,3] },
        { article:"VCP602", age:["BATRAN"], maxYears:10, mandatory:[1,100], total:[1,3] },
        { article:"VCP602", age:["BATRAN"], minYears:10, mandatory:[1,100], total:[1,2] },
        { article:"VCP603", age:["BATRAN"], maxYears:10, mandatory:[1,100], total:[1,4] },
        { article:"VCP603", age:["BATRAN"], minYears:10, mandatory:[1,100], total:[1,3] }
    ];

    let sex = '';
    document.getElementById('sex').addEventListener('change', function(){ sex = this.value; updAgeTag(); });
    document.getElementById('birthDate').addEventListener('input', updAgeTag);
    document.getElementById('liberationArticle').addEventListener('change', updAgeTag);
    document.getElementById('lifeSentence').addEventListener('change', function(){
        document.getElementById('sentenceDuration').classList.toggle('hidden', this.checked);
    });
    function updAgeTag() {
        const b = document.getElementById('birthDate').value.trim();
        const tag = document.getElementById('ageTag');
        if (!b) { tag.innerHTML = ''; return; }
        const bd = parseDate(b);
        if (!bd) { tag.innerHTML = '<small>Format invalid</small>'; return; }
        const a = ageExact(bd, today());
        const cat = getAgeCategoryAtDate(bd, today(), sex);
        const catClass = cat==='MINOR'?'tag-minor':cat==='TANAR'?'tag-tanar':cat==='BATRAN'?'tag-batran':'tag-major';
        tag.innerHTML = `<span class="tag ${catClass}">${cat}</span> <small>${a.y} ani, ${a.m} luni, ${a.d} zile</small>`;
    }

    function addDedRow() {
        const r = document.createElement('div'); r.className = 'period-row deduction-row';
        r.innerHTML = `<div><label>Început</label><input type="text" class="ded-start" placeholder="zz.ll.aaaa"></div><div><label>Sfârșit</label><input type="text" class="ded-end" placeholder="zz.ll.aaaa"></div><div style="min-width:50px;"><label>Zile</label><input type="text" class="ded-days" readonly style="background:rgba(0,0,0,0.2);font-weight:600;"></div><button class="btn btn-danger btn-sm" onclick="this.closest('.period-row').remove();">✕</button>`;
        document.getElementById('deductionsContainer').appendChild(r);
        r.querySelector('.ded-start').addEventListener('input', ()=>updDed(r));
        r.querySelector('.ded-end').addEventListener('input', ()=>updDed(r));
    }
    function updDed(r) {
        const s = r.querySelector('.ded-start').value.trim(), e = r.querySelector('.ded-end').value.trim();
        const f = r.querySelector('.ded-days');
        if (s && e) { const a = parseDate(s), b = parseDate(e); f.value = (a && b && b >= a) ? daysBetween(a, b) + 1 : 'Eroare'; }
        else f.value = '';
    }
    function addManDedRow() {
        const r = document.createElement('div'); r.className = 'period-row';
        r.innerHTML = `<div style="flex:2;"><label>Zile (Legea 169/2017)</label><input type="number" class="manual-days" value="0" min="0"></div><div style="flex:1;"><button class="btn btn-danger btn-sm" onclick="this.closest('.period-row').remove();">✕</button></div>`;
        document.getElementById('manualDeductionsContainer').appendChild(r);
    }
    function addNonExecRow() {
        const r = document.createElement('div'); r.className = 'period-row non-exec-row';
        r.innerHTML = `<div><label>Tip</label><select class="ne-type"><option value="escape">Evadare</option><option value="illness">Boală</option><option value="interruption">Întrerupere</option></select></div><div><label>Data început</label><input type="text" class="ne-start" placeholder="zz.ll.aaaa"></div><div><label>Data final</label><input type="text" class="ne-end" placeholder="zz.ll.aaaa"></div><div style="min-width:50px;"><label>Zile</label><input type="text" class="ne-days" readonly style="background:rgba(255,0,0,0.1);font-weight:600;color:#ff6b6b;"></div><button class="btn btn-danger btn-sm" onclick="this.closest('.period-row').remove();">✕</button>`;
        document.getElementById('nonExecContainer').appendChild(r);
        r.querySelector('.ne-start').addEventListener('input', ()=>updNonExec(r));
        r.querySelector('.ne-end').addEventListener('input', ()=>updNonExec(r));
        r.querySelector('.ne-type').addEventListener('change', ()=>updNonExec(r));
    }
    function updNonExec(r) {
        const s = r.querySelector('.ne-start').value.trim(), e = r.querySelector('.ne-end').value.trim();
        const typ = r.querySelector('.ne-type').value;
        const f = r.querySelector('.ne-days');
        if (s && e) {
            const a = parseDate(s), b = parseDate(e);
            if (a && b && b > a) {
                const diff = daysBetween(a, b);
                if (typ === 'interruption') f.value = diff - 1;
                else f.value = diff;
            } else f.value = 'Eroare';
        } else f.value = '';
    }

    function resetAll() {
        document.getElementById('sex').value = ''; sex = '';
        document.getElementById('birthDate').value = '';
        document.getElementById('liberationArticle').value = '';
        document.getElementById('lifeSentence').checked = false;
        document.getElementById('sentenceDuration').classList.remove('hidden');
        document.getElementById('durYears').value = 0; document.getElementById('durMonths').value = 0; document.getElementById('durDays').value = 0;
        document.getElementById('startDate').value = '';
        document.getElementById('deductionsContainer').innerHTML = '';
        document.getElementById('manualDeductionsContainer').innerHTML = '';
        document.getElementById('nonExecContainer').innerHTML = '';
        document.getElementById('resultsCard').classList.add('hidden');
        document.getElementById('ageTag').innerHTML = '';
        document.getElementById('errorContainer').classList.remove('visible');
    }

    function sumIntervals(intervals) {
        if (!intervals.length) return 0;
        const sorted = intervals.slice().sort((a,b) => a[0].getTime()-b[0].getTime());
        let total = daysBetween(sorted[0][0], sorted[0][1]) + 1;
        let currentEnd = sorted[0][1];
        for (let i=1; i<sorted.length; i++) {
            const [start, end] = sorted[i];
            if (start <= currentEnd) {
                if (end > currentEnd) { total += daysBetween(currentEnd, end); currentEnd = end; }
            } else { total += daysBetween(start, end) + 1; currentEnd = end; }
        }
        return total;
    }

    function validateInputs(birthDate, startDate, life, art, y, m, d) {
        const err = [];
        sex = document.getElementById('sex').value;
        if (!sex) err.push('Selectați sexul.');
        if (!birthDate) err.push('Data nașterii invalidă.');
        if (!startDate) err.push('Data începerii invalidă.');
        if (!life && !art) err.push('Selectați articolul de liberare condiționată.');
        if (!life && y===0 && m===0 && d===0) err.push('Introduceți durata pedepsei.');
        if (birthDate && startDate && birthDate > startDate) err.push('Data nașterii este ulterioară începerii executării.');
        document.querySelectorAll('.deduction-row').forEach((r,i) => {
            const st = r.querySelector('.ded-start').value.trim(), en = r.querySelector('.ded-end').value.trim();
            if (!st||!en) err.push(`Deducerea ${i+1}: date incomplete.`);
            else {
                const sD = parseDate(st), eD = parseDate(en);
                if (!sD||!eD) err.push(`Deducerea ${i+1}: format invalid.`);
                else if (eD < sD) err.push(`Deducerea ${i+1}: sfârșit înainte de început.`);
            }
        });
        document.querySelectorAll('.non-exec-row').forEach((r,i) => {
            const st = r.querySelector('.ne-start').value.trim(), en = r.querySelector('.ne-end').value.trim();
            if (!st||!en) err.push(`Perioada neexecutată ${i+1}: date incomplete.`);
            else {
                const sD = parseDate(st), eD = parseDate(en);
                if (!sD||!eD) err.push(`Perioada neexecutată ${i+1}: format invalid.`);
                else if (eD <= sD) err.push(`Perioada neexecutată ${i+1}: date invalide.`);
            }
        });
        return err;
    }

    function calculateAll() {
        const errC = document.getElementById('errorContainer'); errC.classList.remove('visible');
        const birthDate = parseDate(document.getElementById('birthDate').value.trim());
        const startDate = parseDate(document.getElementById('startDate').value.trim());
        const life = document.getElementById('lifeSentence').checked;
        const art = document.getElementById('liberationArticle').value;
        const y = parseInt(document.getElementById('durYears').value)||0, m = parseInt(document.getElementById('durMonths').value)||0, d = parseInt(document.getElementById('durDays').value)||0;
        sex = document.getElementById('sex').value;
        const err = validateInputs(birthDate, startDate, life, art, y, m, d);
        if (err.length>0) { errC.innerHTML = err.map(e=>'• '+e).join('<br>'); errC.classList.add('visible'); return; }

        let totalDays, theorExp;
        if (life) {
            const d20 = new Date(startDate); d20.setFullYear(d20.getFullYear()+20); d20.setDate(d20.getDate()-1);
            totalDays = daysBetween(startDate, d20) + 1; theorExp = d20;
        } else {
            theorExp = addCalendarSafe(startDate, y, m, d); theorExp.setDate(theorExp.getDate()-1);
            totalDays = daysBetween(startDate, theorExp) + 1;
        }

        const dedIntervals = []; document.querySelectorAll('.deduction-row').forEach(r => { const sD=parseDate(r.querySelector('.ded-start').value.trim()), eD=parseDate(r.querySelector('.ded-end').value.trim()); if(sD&&eD) dedIntervals.push([sD,eD]); });
        let ded = sumIntervals(dedIntervals);
        document.querySelectorAll('.manual-days').forEach(i=>{ const v=parseInt(i.value); if(!isNaN(v)&&v>0) ded+=v; });
        if (ded > totalDays) { errC.innerHTML = '• Deducerile depășesc mandatul total.'; errC.classList.add('visible'); return; }

        const nonIntervals = []; document.querySelectorAll('.non-exec-row').forEach(r => { const sD=parseDate(r.querySelector('.ne-start').value.trim()), eD=parseDate(r.querySelector('.ne-end').value.trim()); if(sD&&eD) nonIntervals.push([sD,eD]); });
        const non = sumIntervals(nonIntervals);

        let realExp = new Date(theorExp); realExp.setDate(realExp.getDate() - ded + non);
        const ageAtExpiry = getAgeCategoryAtDate(birthDate, theorExp, sex);

        let mR=1/2, tR=2/3, pM=Infinity, pT=Infinity, articleInfo='';
        if (life) { mR=1/2; tR=1/2; pM=totalDays; pT=totalDays; articleInfo='NCP art. 99 (viață)'; }
        else {
            const totalMonths = y*12 + m + d/30; const sentenceOver10 = totalMonths > 120;
            if (art === 'NCP100') {
                const expiresBefore60 = theorExp < new Date(birthDate.getFullYear()+60, birthDate.getMonth(), birthDate.getDate());
                if (expiresBefore60) { if(sentenceOver10){mR=2/3;tR=3/4;pM=7305;pT=7305;} else{mR=1/2;tR=2/3;} articleInfo = `NCP art. 100 (${ageAtExpiry}, expiră < 60 ani) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
                else { if(sentenceOver10){mR=1/2;tR=2/3;pM=7305;pT=7305;} else{mR=1/3;tR=1/2;} articleInfo = `NCP art. 100 (${ageAtExpiry}, expiră ≥ 60 ani) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
            } else {
                const rule = liberationRules.find(r => r.article === art && r.age.includes(ageAtExpiry) && ((r.life&&life) || (!r.life && ((r.maxYears&&!sentenceOver10)||(r.minYears&&sentenceOver10)||(!r.maxYears&&!r.minYears)))));
                if (rule) { mR=rule.mandatory[0]/rule.mandatory[1]; tR=rule.total[0]/rule.total[1]; pM=rule.mandatory[2]||Infinity; pT=rule.total[2]||Infinity; articleInfo=`${art} (${ageAtExpiry}) ${sentenceOver10 ? '>10 ani' : '≤10 ani'}`; }
                else { errC.innerHTML='• Nu există regulă de liberare.'; errC.classList.add('visible'); return; }
            }
        }

        let mDays=Math.floor(totalDays*mR), tDays=Math.floor(totalDays*tR);
        if(mDays>pM)mDays=pM; if(tDays>pT)tDays=pT;
        let mDate=new Date(startDate); mDate.setDate(mDate.getDate()+mDays-1); mDate.setDate(mDate.getDate()-ded+non);
        let tDate=new Date(startDate); tDate.setDate(tDate.getDate()+tDays-1); tDate.setDate(tDate.getDate()-ded+non);
        const fifth=Math.floor(totalDays/5); let fDate=new Date(startDate); fDate.setDate(fDate.getDate()+fifth-1); fDate.setDate(fDate.getDate()-ded+non);
        const executedDays=Math.max(0, daysBetween(startDate, today())+1-ded-non);

        const quarantineEnd = new Date(startDate);
        quarantineEnd.setDate(quarantineEnd.getDate() + 20);

        const mDaysAdjusted = daysBetween(startDate, mDate) + 1;
        const tDaysAdjusted = daysBetween(startDate, tDate) + 1;
        const fifthAdjusted = daysBetween(startDate, fDate) + 1;

        const nume=document.getElementById('observations').value.trim();
        let html='';
        if(nume) html+=`<div class="result-item" style="margin-bottom:8px;"><div class="result-label">Nume deținut</div><div class="result-value">${nume}</div></div>`;

        html+=`<div class="result-section"><h4>DETALII MANDAT</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">Expirare teoretică</div><div class="result-value">${fmtDate(theorExp)}</div></div>`;
        html+=`<div class="result-item important"><div class="result-label">Expirare REALĂ</div><div class="result-value">${fmtDate(realExp)}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile deduse</div><div class="result-value">${ded} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile adăugate (neexecutate)</div><div class="result-value" style="color:#ff6b6b;">${non} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Zile executate efectiv</div><div class="result-value">${executedDays} zile</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>FRACȚII LIBERARE CONDIȚIONATĂ</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">FRACȚIE MINIMĂ OBLIGATORIE</div><div class="result-value"><span class="fraction">${fracStr(mR)}</span> → (fără deduceri: ${mDays}z / cu deduceri: ${mDaysAdjusted}z)</div><div class="result-label" style="margin-top:4px;">Data</div><div class="result-value">${fmtDate(mDate)}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">DATA PROPOZABILĂ</div><div class="result-value"><span class="fraction">${fracStr(tR)}</span> → (fără deduceri: ${tDays}z / cu deduceri: ${tDaysAdjusted}z)</div><div class="result-label" style="margin-top:4px;">Data</div><div class="result-value">${fmtDate(tDate)}</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>REANALIZARE 1/5</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">1/5 mandat</div><div class="result-value">(fără deduceri: ${fifth}z / cu deduceri: ${fifthAdjusted}z)</div><div class="result-label" style="margin-top:4px;">Data împlinirii</div><div class="result-value">${fmtDate(fDate)}</div></div>`;
        html+=`</div></div>`;

        html+=`<div class="result-section"><h4>ALTE DATE</h4><div class="result-grid">`;
        html+=`<div class="result-item"><div class="result-label">Articol LC</div><div class="result-value">${articleInfo}</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Mandat total</div><div class="result-value">${totalDays} zile</div></div>`;
        html+=`<div class="result-item"><div class="result-label">Carantină expiră</div><div class="result-value">${fmtDate(quarantineEnd)}</div></div>`;
        html+=`</div></div>`;

        document.getElementById('resultsContent').innerHTML=html;
        document.getElementById('resultsCard').classList.remove('hidden');
    }

    function fracStr(r){ if(r===1/3)return'⅓';if(r===1/2)return'½';if(r===2/3)return'⅔';if(r===3/4)return'¾';if(r===1/4)return'¼';if(r===1/100)return'1/100';return r.toString(); }

    function exportCSV() {
        let csv = 'Indicator,Valoare\n';
        csv += `"Sex","${document.getElementById('sex').value}"\n`;
        csv += `"Data nașterii","${document.getElementById('birthDate').value}"\n`;
        csv += `"Nume deținut","${document.getElementById('observations').value}"\n`;
        csv += `"Articol LC","${document.getElementById('liberationArticle').value}"\n`;
        csv += `"Detențiune pe viață","${document.getElementById('lifeSentence').checked ? 'Da' : 'Nu'}"\n`;
        csv += `"Durată","${document.getElementById('durYears').value} ani, ${document.getElementById('durMonths').value} luni, ${document.getElementById('durDays').value} zile"\n`;
        csv += `"Data începerii","${document.getElementById('startDate').value}"\n`;
        document.querySelectorAll('.deduction-row').forEach((r,i) => {
            const st = r.querySelector('.ded-start').value.trim();
            const en = r.querySelector('.ded-end').value.trim();
            if (st && en) csv += `"Deducere perioadă ${i+1}","${st} - ${en}"\n`;
        });
        document.querySelectorAll('.manual-days').forEach((inp,i) => { const v=parseInt(inp.value); if(v>0) csv += `"Deducere manuală ${i+1}","${v} zile"\n`; });
        document.querySelectorAll('.non-exec-row').forEach((r,i) => {
            const typ=r.querySelector('.ne-type').value;
            const st=r.querySelector('.ne-start').value.trim();
            const en=r.querySelector('.ne-end').value.trim();
            if (st && en) csv += `"Perioadă neexecutată ${i+1} (${typ})","${st} - ${en}"\n`;
        });
        csv += '\n';
        const content = document.getElementById('resultsContent');
        if (content) {
            content.querySelectorAll('.result-item').forEach(item => {
                const label = item.querySelector('.result-label')?.innerText || '';
                const value = item.querySelector('.result-value')?.innerText || '';
                csv += `"${label}","${value}"\n`;
            });
        }
        const blob = new Blob([csv], {type:'text/csv'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'calculator_pedepse.csv';
        a.click();
    }
</script>

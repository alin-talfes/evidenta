name: Apply global EV favicon
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_favicon.py
      - .github/workflows/apply-favicon.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply favicon links
        run: python3 scripts/apply_favicon.py
      - name: Verify
        run: |
          npm run check:syntax
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html termene.html contopiri.html transfer/index.html transfer/rules.html manifest.json
          git commit -m "Apply EV favicon globally"
          git push origin main

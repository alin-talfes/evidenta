name: Fix Safari share
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_safari_share.py
      - .github/workflows/fix-safari-share.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Safari compatibility patch
        run: python3 scripts/fix_safari_share.py
      - name: Verify
        run: |
          npm run check:syntax
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html termene.html contopiri.html transfer/index.html transfer/rules.html
          git commit -m "Fix Safari share metadata and favicon compatibility"
          git push origin main

name: Refine saved badge and copy summary
on:
  push:
    branches: [main]
    paths:
      - scripts/refine_badge_copy.py
      - .github/workflows/refine-badge-copy.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/refine_badge_copy.py
      - run: npm run check:syntax
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css js/app.js js/export.js js/storage.js index.html termene.html contopiri.html transfer/index.html transfer/rules.html tests/run-tests.js
          git commit -m "Refine saved case badge and copied summary"
          git push origin main

name: Remove personal projects and verify CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-personal-projects.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove personal projects section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n\s*<!-- Secțiunea ALTE PROIECTE PERSONALE.*?</div>\s*</div>\s*\n',
              re.S,
          )
          new_text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one personal-projects block, removed {count}')
          p.write_text(new_text, encoding='utf-8')

      - name: Verify one shared stylesheet and scope
        shell: bash
        run: |
          set -euo pipefail

          # The repository must contain exactly one CSS file.
          mapfile -t css_files < <(find . -type f -name '*.css' -not -path './.git/*' | sort)
          printf 'CSS files:\n%s\n' "${css_files[*]}"
          test "${#css_files[@]}" -eq 1
          test "${css_files[0]}" = './css/style.css'

          # Every application page must load the same stylesheet directly.
          grep -Eq '<link rel="stylesheet" href="css/style.css\?v=[0-9]+">' index.html
          grep -Eq '<link rel="stylesheet" href="css/style.css\?v=[0-9]+">' termene.html
          grep -Eq '<link rel="stylesheet" href="css/style.css\?v=[0-9]+">' contopiri.html
          grep -Eq '<link rel="stylesheet" href="../css/style.css\?v=[0-9]+">' transfer/index.html
          grep -Eq '<link rel="stylesheet" href="../css/style.css\?v=[0-9]+" ?/?>' transfer/rules.html

          # No embedded stylesheet blocks remain.
          ! grep -Rni --include='*.html' '<style' .

          # Requested category and links must be gone.
          ! grep -Rni --include='*.html' 'ALTE PROIECTE PERSONALE' .
          ! grep -Rni --include='*.html' '>TRĂSĂTURI<' .
          ! grep -Rni --include='*.html' '>AMPRENTE<' .

          # Presentation-only task: no JS may be changed.
          if git diff --name-only | grep -E '\.js$'; then
            echo 'Unexpected JavaScript modification.' >&2
            exit 1
          fi

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-personal-projects.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove personal projects section'
          git push

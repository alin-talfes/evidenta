name: Update Instructaj glossary and responsive nav
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-instructaj-glossary-nav.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/update_instructaj_glossary_nav.py
      - run: npm run check:syntax
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Îmbogățește glosarul și centrează meniul responsive"
          git push origin main

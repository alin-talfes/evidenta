name: Calibrate sentence calculator

"on":
  push:
    branches: [main]
    paths:
      - 'tools/calibrate-pedepse.py'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calibration
        run: python3 tools/calibrate-pedepse.py
      - name: Verify syntax and regression tests
        run: |
          npm run check:syntax
          npm test
      - name: Commit calibrated calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Calibrate sentence and conditional release rules"
          git push origin main

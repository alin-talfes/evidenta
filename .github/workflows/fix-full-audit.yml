name: Comprehensive audit remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-full-audit.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and run remediation script
        run: |
          git show 343f2fe3ec640e5906077efa578c895116972145:.github/workflows/fix-full-audit.yml > /tmp/embedded.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/embedded.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(lines) if "python3 <<'PY'" in l) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          Path('/tmp/remediate.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python3 /tmp/remediate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/run-tests.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert.equal(d.effectiveDeadline.getDate(),21);", "assert.equal(d.effectiveDeadline.getDate(),22);\nlet free=T.calculateDeadline({start:new Date(2026,5,8),duration:3,unit:'days',termType:'general'}); assert.equal(free.effectiveDeadline.getDate(),12);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run syntax and regression checks
        run: |
          set -euo pipefail
          npm run check:syntax
          npm test
          ! grep -R "fonts.googleapis.com" css/style.css
          ! grep -R "user-scalable=no" -- *.html transfer/*.html
      - name: Commit remediation
        run: |
          set -euo pipefail
          rm .github/workflows/fix-full-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve full HTML JavaScript CSS audit findings"
          git push origin main

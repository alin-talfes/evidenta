name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidenta:
    name: Evidență
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:syntax
      - run: npm test

  mobile-webkit:
    name: iPhone WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-visual-audit-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  ofiter:
    name: Ofițer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ofiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save postcss
      - run: node scripts/audit-css.mjs
      - run: node scripts/audit-clean-learning.mjs
      - run: node scripts/audit-module-loading.mjs
      - name: Verifică sintaxa JavaScript
        run: find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  semnalmente:
    name: Semnalmente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semnalmente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

name: User friendly module polish
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ux-polish.yml
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UX polish
        run: python3 .github/scripts/ux_polish.py
      - name: Verify
        run: |
          grep -q "M O D U L E" css/style.css
          npm run check:syntax
          npm test
      - name: Commit changes
        run: |
          rm .github/workflows/ux-polish.yml
          rm .github/scripts/ux_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish module navigation and user guidance"
          git push origin main
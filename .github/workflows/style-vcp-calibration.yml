name: Style and VCP calibration
on:
  push:
    branches: [main]
    paths:
      - scripts/style_vcp_patch.py
      - .github/workflows/style-vcp-calibration.yml
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/style_vcp_patch.py
      - name: Verify
        run: |
          npm run check:syntax
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html termene.html contopiri.html transfer/index.html transfer/rules.html js/rules.js tests/run-tests.js version.json
          git commit -m "Calibrate VCP age conditions and refresh visual assets"
          git push origin main

name: Fix non-executed interval rules
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_nonexec_rules.py
      - .github/workflows/fix-nonexec-rules.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/fix_nonexec_rules.py
      - run: npm run check:syntax
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/rules.js tests/run-tests.js
          git commit -m "Correct non-executed interval endpoint rules"
          git push origin main

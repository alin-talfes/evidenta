name: Universal navy white redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/universal-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply universal design system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          css = Path('css/style.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* ===== UNIVERSAL NAVY / WHITE DESIGN SYSTEM ===== */'
          if marker in text:
              text = text.split(marker)[0].rstrip() + '\n'
          overrides = Path('.github/universal-overrides.txt').read_text(encoding='utf-8')
          css.write_text(text.rstrip() + '\n\n' + overrides.strip() + '\n', encoding='utf-8')
          pages = [Path('index.html'), Path('termene.html'), Path('contopiri.html'), Path('transfer/index.html'), Path('transfer/rules.html')]
          for p in pages:
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(css/style\.css\?v=)\d+', r'\g<1>33', s)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify design scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -type f -name '*.css' -not -path './.git/*' | wc -l)" -eq 1
          grep -q 'UNIVERSAL NAVY / WHITE DESIGN SYSTEM' css/style.css
          for f in index.html termene.html contopiri.html; do grep -q 'css/style.css?v=33' "$f"; done
          for f in transfer/index.html transfer/rules.html; do grep -q '../css/style.css?v=33' "$f"; done
          ! grep -Rni --include='*.html' '<style' .
          if git diff --name-only | grep -E '^js/(app|rules|legal|storage|export|ui|utils)\.js$|^transfer/rules\.js$'; then
            echo 'Unexpected business logic JavaScript modification.' >&2
            exit 1
          fi

      - name: Commit redesign and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/universal-overrides.txt .github/workflows/universal-redesign.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply universal navy and white design system'
          git push

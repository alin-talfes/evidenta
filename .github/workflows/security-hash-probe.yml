name: Security dependency hash probe
on:
  push:
    paths:
      - '.github/workflows/security-hash-probe.yml'
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Calculează SHA-256
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.min.mjs'
            'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/pdf.worker.min.mjs'
            'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core.wasm'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-simd.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-simd.wasm'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-lstm.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-lstm.wasm'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-simd-lstm.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-simd-lstm.wasm'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-relaxedsimd.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-relaxedsimd.wasm'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-relaxedsimd-lstm.wasm.js'
            'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0/tesseract-core-relaxedsimd-lstm.wasm'
            'https://tessdata.projectnaptha.com/4.0.0_best/ron.traineddata.gz'
          )
          for url in "${urls[@]}"; do
            tmp=$(mktemp)
            curl --fail --silent --show-error --location "$url" -o "$tmp"
            bytes=$(wc -c < "$tmp" | tr -d ' ')
            hash=$(sha256sum "$tmp" | awk '{print $1}')
            echo "SHA256 $hash $bytes $url"
            rm -f "$tmp"
          done

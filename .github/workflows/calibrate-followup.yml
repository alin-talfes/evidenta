name: Conditional release calibration follow-up
on:
  push:
    branches: [main]
    paths:
      - scripts/calibrate_followup.py
      - .github/workflows/calibrate-followup.yml
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply calibration
        run: python3 scripts/calibrate_followup.py
      - name: Verify
        run: |
          npm run check:syntax
          npm test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/ui.js tests/run-tests.js version.json
          git commit -m "Tighten life-sentence conditional release flow"
          git push origin main

name: Finalize unified CSS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-unified-css.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presentation-only cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root_pages = [Path('index.html'), Path('termene.html'), Path('contopiri.html')]
          transfer_pages = [Path('transfer/index.html'), Path('transfer/rules.html')]

          for path in root_pages:
              text = path.read_text(encoding='utf-8')
              text, n1 = re.subn(
                  r'\s*<link rel="stylesheet" href="css/app-shell\.css\?v=1">',
                  '',
                  text,
                  count=1,
              )
              if n1 != 1:
                  raise SystemExit(f'{path}: expected one app-shell reference, found {n1}')
              text = re.sub(r'css/style\.css\?v=30', 'css/style.css?v=32', text, count=1)
              path.write_text(text, encoding='utf-8')

          path = Path('transfer/index.html')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'href="style\.css\?v=30"', 'href="../css/style.css?v=32"', text, count=1)
          text, n2 = re.subn(r'\s*<link rel="stylesheet" href="\.\./css/app-shell\.css\?v=1">', '', text, count=1)
          if (n1, n2) != (1, 1):
              raise SystemExit(f'{path}: stylesheet migration mismatch {(n1, n2)}')
          path.write_text(text, encoding='utf-8')

          path = Path('transfer/rules.html')
          text = path.read_text(encoding='utf-8')
          text, n1 = re.subn(r'href="style\.css\?v=30"', 'href="../css/style.css?v=32"', text, count=1)
          text, n2 = re.subn(r'\n\s*<style>.*?</style>', '', text, count=1, flags=re.S)
          text, n3 = re.subn(r'\s*<link rel="stylesheet" href="\.\./css/app-shell\.css\?v=1"\s*/>', '', text, count=1)
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'{path}: cleanup mismatch {(n1, n2, n3)}')
          path.write_text(text, encoding='utf-8')

          pages = root_pages + transfer_pages
          for path in pages:
              text = path.read_text(encoding='utf-8')
              if '<style' in text.lower():
                  raise SystemExit(f'{path}: embedded <style> remains')
              if 'app-shell.css' in text or 'href="style.css' in text:
                  raise SystemExit(f'{path}: legacy stylesheet reference remains')
              links = re.findall(r'<link[^>]+rel="stylesheet"[^>]+href="([^"]+)"', text)
              expected = 'css/style.css?v=32' if path.parent == Path('.') else '../css/style.css?v=32'
              if links != [expected]:
                  raise SystemExit(f'{path}: expected only {expected}, got {links}')

          for obsolete in [Path('css/app-shell.css'), Path('transfer/style.css')]:
              if not obsolete.exists():
                  raise SystemExit(f'{obsolete}: expected compatibility shim is missing')
              obsolete.unlink()
          PY

      - name: Verify scope and commit
        shell: bash
        run: |
          git rm .github/workflows/finalize-unified-css.yml
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -E '(^|/)js/|\.js$'; then
            echo 'Refusing to commit: JavaScript changed.' >&2
            exit 1
          fi
          for file in index.html termene.html contopiri.html transfer/index.html transfer/rules.html; do
            grep -q 'css/style.css?v=32' "$file" || { echo "Missing unified CSS in $file" >&2; exit 1; }
          done
          if grep -R -n -E 'app-shell\.css|href="style\.css' --include='*.html' .; then
            echo 'Legacy stylesheet reference remains.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html termene.html contopiri.html transfer/index.html transfer/rules.html css/app-shell.css transfer/style.css
          git commit -m 'Complete unified application stylesheet migration'
          git push origin HEAD:main

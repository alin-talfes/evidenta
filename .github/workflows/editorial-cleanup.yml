name: Clean routes and Instructaj cards
on:
  push:
    branches: [main]
    paths: [.github/workflows/editorial-cleanup.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/editorial_cleanup.py
      - name: Normalizează redirecturile și testele canonice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in ['contopiri.html', 'transfer/rules.html', 'semnalmente/benchmark.html']:
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\n\s*<script>location\.replace\([^<]*?</script>', '', s)
              p.write_text(s, encoding='utf-8')
          p = Path('tests/clean-routes.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("html.includes('location.replace')", "/http-equiv=[\"']refresh/i.test(html)")
          p.write_text(s, encoding='utf-8')
          p = Path('tests/run-tests.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'contopiri.html'", "'contopiri/index.html'")
          s = s.replace("'transfer/rules.html'", "'transfer/rules/index.html'")
          s = s.replace("'semnalmente/benchmark.html'", "'semnalmente/benchmark/index.html'")
          p.write_text(s, encoding='utf-8')
          PY
      - run: npm run check:syntax
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Folosește URL-uri curate și închide cardurile Fundamente"
          git push origin main
